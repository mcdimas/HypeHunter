# To enable, copy to .github/workflows/ci.yml with workflow-authorized credentials.
name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hype_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d hype_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci && npm test
      - working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://test_user:test_password@127.0.0.1:5432/hype_test
          MEDIA_ROOT: /tmp/hype-test-media
        run: |
          python -m pip install -r requirements-dev.txt
          python -m alembic upgrade head
          python -m pytest -q
          AUTH_PG_TEST_URL="$DATABASE_URL" python -m pytest -q tests/test_auth.py
